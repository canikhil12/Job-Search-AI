spring:
  application:
    name: jobmatch-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/jobmatch}
    username: ${DATABASE_USER:jobmatch}
    password: ${DATABASE_PASSWORD:jobmatch}
    hikari:
      # Kept small on purpose: managed Postgres (Supabase) has tight connection limits,
      # and behind the Supavisor session pooler a large local pool buys nothing.
      maximum-pool-size: ${DB_POOL_SIZE:5}
      # Fail fast at startup if the DB is unreachable, rather than hanging requests.
      connection-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Supabase's "public" schema is not empty on a fresh project (enabling the pgvector
    # extension adds objects there). Flyway refuses its first run against a non-empty schema
    # unless told to baseline. Baseline at version 0 — NOT the default 1, which would mark V1
    # as already-applied and skip creating the users table — so V1 (version 1 > 0) still runs.
    # On a truly empty schema (local Docker) this is a no-op and V1 runs normally.
    baseline-on-migrate: true
    baseline-version: 0

# JWT signing secret. Must be >= 32 bytes (256 bits) for HS256; the app fails fast otherwise.
jwt:
  secret: ${JWT_SECRET:}

# Cross-origin allow-list. Overridden per environment (e.g. the Vercel URL in prod).
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Expose actuator health only (keep-warm ping target on Render later).
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

server:
  # Render (and most PaaS hosts) inject the port to bind via $PORT; default to 8080 locally.
  port: ${PORT:8080}
