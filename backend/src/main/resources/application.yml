spring:
  application:
    name: jobmatch-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/jobmatch}
    username: ${DATABASE_USER:jobmatch}
    password: ${DATABASE_PASSWORD:jobmatch}
    hikari:
      # Kept small on purpose: managed Postgres (Supabase) has tight connection limits,
      # and behind the Supavisor session pooler a large local pool buys nothing.
      maximum-pool-size: ${DB_POOL_SIZE:5}
      # Fail fast at startup if the DB is unreachable, rather than hanging requests.
      connection-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE:5MB}
      max-request-size: ${MAX_UPLOAD_SIZE:5MB}
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Supabase's "public" schema is not empty on a fresh project (enabling the pgvector
    # extension adds objects there). Flyway refuses its first run against a non-empty schema
    # unless told to baseline. Baseline at version 0 — NOT the default 1, which would mark V1
    # as already-applied and skip creating the users table — so V1 (version 1 > 0) still runs.
    # On a truly empty schema (local Docker) this is a no-op and V1 runs normally.
    baseline-on-migrate: true
    baseline-version: 0

# JWT signing secret. Must be >= 32 bytes (256 bits) for HS256; the app fails fast otherwise.
jwt:
  secret: ${JWT_SECRET:}

# Cross-origin allow-list. Overridden per environment (e.g. the Vercel URL in prod).
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Resume file storage. Default "memory" (local dev/tests, no external deps); set to
# "supabase" in prod to push raw files to Supabase Storage.
resume:
  storage:
    provider: ${RESUME_STORAGE_PROVIDER:memory}

# Supabase Storage settings — only used when resume.storage.provider=supabase.
supabase:
  url: ${SUPABASE_URL:}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
  storage:
    bucket: ${SUPABASE_STORAGE_BUCKET:resumes}

# Embeddings. Default "fake" (deterministic, no key — for local/tests); set to "openai" in prod
# for any OpenAI-compatible endpoint (OpenAI directly, or a gateway like OpenRouter).
# dimension must match the DB column: jobs.embedding is vector(1536) = text-embedding-3-small.
embedding:
  provider: ${EMBEDDING_PROVIDER:fake}
  dimension: 1536
  api-key: ${EMBEDDING_API_KEY:}
  base-url: ${EMBEDDING_BASE_URL:https://api.openai.com/v1}
  model: ${EMBEDDING_MODEL:text-embedding-3-small}

# Seed the jobs table with bundled real postings on first startup (no-op once populated).
jobs:
  seed-on-startup: ${SEED_JOBS:true}

# Chat model for AI features (Phase 5 gap analysis, Phase 6 cover letters). Default "fake"
# (canned stream, no key — local/tests); set to "anthropic" in prod (native Messages API).
chat:
  provider: ${CHAT_PROVIDER:fake}
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:}
    base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
    model: ${CHAT_MODEL:claude-sonnet-5}
    version: ${ANTHROPIC_VERSION:2023-06-01}
    max-tokens: ${CHAT_MAX_TOKENS:1024}

# Expose actuator health only (keep-warm ping target on Render later).
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

server:
  # Render (and most PaaS hosts) inject the port to bind via $PORT; default to 8080 locally.
  port: ${PORT:8080}
