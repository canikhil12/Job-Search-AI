# Local orchestration for the JobMatch microservices platform.
# Phase 1: infrastructure (Postgres/pgvector + Kafka) and the platform services
# (Config Server, Eureka, Gateway). Domain services are added in later phases.
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: jm-postgres
    environment:
      POSTGRES_USER: jobmatch
      POSTGRES_PASSWORD: jobmatch
      POSTGRES_DB: jobmatch
    ports:
      - "5432:5432"
    volumes:
      - ./init-db:/docker-entrypoint-initdb.d
      - jm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobmatch"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: bitnami/kafka:3.7
    container_name: jm-kafka
    environment:
      # Single-node KRaft (no ZooKeeper).
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "9092:9092"

  config-server:
    build:
      context: .
      dockerfile: config-server/Dockerfile
    container_name: jm-config
    ports:
      - "8888:8888"

  discovery-server:
    build:
      context: .
      dockerfile: discovery-server/Dockerfile
    container_name: jm-eureka
    environment:
      EUREKA_HOSTNAME: discovery-server
    ports:
      - "8761:8761"

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: jm-gateway
    environment:
      CONFIG_URI: http://config-server:8888
      EUREKA_URI: http://discovery-server:8761/eureka
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      - config-server
      - discovery-server

volumes:
  jm_pgdata:
