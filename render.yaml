# Render Blueprint — deploys the Spring Boot backend from its Dockerfile.
# In the Render dashboard: New > Blueprint, point it at this repo. Secrets are marked
# sync:false so Render prompts you to fill them in (nothing sensitive is committed).
services:
  - type: web
    name: jobmatch-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Render pings this to gate deploys; it's also the keep-warm target for the free tier.
    healthCheckPath: /actuator/health
    envVars:
      # JWT signing secret — MUST be >= 32 bytes or the app fails fast at startup.
      # Generate one with:  openssl rand -base64 48
      - key: JWT_SECRET
        sync: false
      # Supabase connection (use the SESSION pooler; see DEPLOYMENT.md for the exact format).
      # Example URL: jdbc:postgresql://aws-0-<region>.pooler.supabase.com:5432/postgres?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USER      # e.g. postgres.<project-ref>
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      # Comma-separated allowed origins — set to your Vercel URL once the frontend is deployed.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # --- Phase 2: resume file storage (Supabase Storage) ---
      - key: RESUME_STORAGE_PROVIDER   # set to: supabase
        sync: false
      - key: SUPABASE_URL              # e.g. https://<project-ref>.supabase.co
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY # Supabase secret key (sb_secret_...); backend-only
        sync: false
      # --- Phase 3: embeddings (any OpenAI-compatible endpoint: OpenAI or OpenRouter) ---
      - key: EMBEDDING_PROVIDER        # set to: openai
        sync: false
      - key: EMBEDDING_API_KEY         # OpenAI key (sk-...) or OpenRouter key (sk-or-...)
        sync: false
      - key: EMBEDDING_BASE_URL        # OpenAI: https://api.openai.com/v1  | OpenRouter: https://openrouter.ai/api/v1
        sync: false
      - key: EMBEDDING_MODEL           # OpenAI: text-embedding-3-small  | OpenRouter: openai/text-embedding-3-small
        sync: false
      # --- Phase 5+: chat model for AI features (Anthropic Messages API) ---
      - key: CHAT_PROVIDER             # set to: anthropic
        sync: false
      - key: ANTHROPIC_API_KEY         # Anthropic API key (sk-ant-...)
        sync: false
      - key: CHAT_MODEL                # optional, default claude-sonnet-5
        sync: false
      # --- Live job search (Adzuna) ---
      - key: JOB_SEARCH_PROVIDER       # set to: adzuna
        sync: false
      - key: ADZUNA_APP_ID
        sync: false
      - key: ADZUNA_APP_KEY
        sync: false
      - key: ADZUNA_COUNTRY            # optional, default us
        sync: false
