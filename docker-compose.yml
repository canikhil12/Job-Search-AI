services:
  postgres:
    # pgvector-enabled Postgres 16 (mirrors the production Neon + pgvector setup).
    image: pgvector/pgvector:pg16
    container_name: jobmatch-postgres
    environment:
      POSTGRES_DB: jobmatch
      POSTGRES_USER: jobmatch
      POSTGRES_PASSWORD: jobmatch
    ports:
      # Host port is overridable via JOBMATCH_DB_PORT (root .env) for machines that
      # already run Postgres on 5432. Container port stays 5432.
      - "${JOBMATCH_DB_PORT:-5432}:5432"
    volumes:
      - jobmatch_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobmatch -d jobmatch"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  jobmatch_pgdata:
